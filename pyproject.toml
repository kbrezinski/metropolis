[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metropolis-ot-detection-systems"
version = "0.1.1"
description = "Testbeds and experiment tooling for OT/ICS network traffic and provenance-based detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.2.3,<3",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.2",
    "torch>=2.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q", "--basetemp=.venv/.pytest_tmp"]
tmp_path_retention_policy = "none"
cache_dir = ".venv/.pytest_cache"
markers = [
    "slow: integration checks that build and install the wheel",
]

[tool.codespell]
# "ot" is the operational-technology domain term; "checkin" is the control-frame
# verb used by the synthetic Mirai and Merlin attack-lab models.
ignore-words-list = "ot,checkin"

[tool.hatch.build.targets.wheel]
packages = ["src/metropolis"]

[tool.hatch.build.targets.wheel.force-include]
# The topology library loads all four documents from the package, so a wheel
# must ship all four, not just the address plan.
"testbeds/metropolis/datasets/water_treatment_v1/topology/address-plan.yaml" = "metropolis/data/testbeds/metropolis/water_treatment_v1/topology/address-plan.yaml"
"testbeds/metropolis/datasets/water_treatment_v1/topology/links.yaml" = "metropolis/data/testbeds/metropolis/water_treatment_v1/topology/links.yaml"
"testbeds/metropolis/datasets/water_treatment_v1/device_instances/initial_devices.yaml" = "metropolis/data/testbeds/metropolis/water_treatment_v1/device_instances/initial_devices.yaml"
"testbeds/metropolis/datasets/water_treatment_v1/device_instances/infrastructure.yaml" = "metropolis/data/testbeds/metropolis/water_treatment_v1/device_instances/infrastructure.yaml"

[tool.hatch.build.targets.sdist.force-include]
"testbeds/metropolis/datasets/water_treatment_v1/topology/address-plan.yaml" = "testbeds/metropolis/datasets/water_treatment_v1/topology/address-plan.yaml"
"testbeds/metropolis/datasets/water_treatment_v1/topology/links.yaml" = "testbeds/metropolis/datasets/water_treatment_v1/topology/links.yaml"
"testbeds/metropolis/datasets/water_treatment_v1/device_instances/initial_devices.yaml" = "testbeds/metropolis/datasets/water_treatment_v1/device_instances/initial_devices.yaml"
"testbeds/metropolis/datasets/water_treatment_v1/device_instances/infrastructure.yaml" = "testbeds/metropolis/datasets/water_treatment_v1/device_instances/infrastructure.yaml"

[dependency-groups]
# The experiment toolkit needs paho-mqtt, paramiko, pymodbus, and scapy. They
# are pinned to the versions scripts/attacks/requirements.txt names, because the
# device models and tools are written against those APIs: pymodbus 4.x moves the
# server API and breaks the Modbus controller. Keep the two lists in step.
#
# matplotlib is used for topology images and experiment metrics charts;
# Docker SDK access is used only by the read-only experiment resource collector.
# These tools import them lazily and keep them out of runtime dependencies.
# networkx already arrives transitively with
# scikit-learn; it is named here because it is used directly.
dev = [
    "codespell>=2.4.2",
    "dnp3py==0.6.0",
    "docker[ssh]>=7.1,<8",
    "jsonschema>=4.23.0",
    "matplotlib>=3.9",
    "networkx>=3.0",
    "paho-mqtt==2.1.0",
    "paramiko==4.0.0",
    "pre-commit>=4.5.1",
    "pymodbus==3.8.6",
    "pywin32>=308; sys_platform == 'win32'",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "scapy==2.6.1",
]
