[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metropolis-ot-detection-systems"
version = "0.1.1"
description = "To be added..."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=2.2.3,<3",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.5.2",
    "torch>=2.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-q"]

[tool.hatch.build.targets.wheel]
packages = ["src/metropolis"]

[tool.hatch.build.targets.wheel.force-include]
"testbeds/metropolis/datasets/water_treatment_v1/topology/address-plan.yaml" = "metropolis/data/testbeds/metropolis/water_treatment_v1/topology/address-plan.yaml"

[tool.hatch.build.targets.sdist.force-include]
"testbeds/metropolis/datasets/water_treatment_v1/topology/address-plan.yaml" = "testbeds/metropolis/datasets/water_treatment_v1/topology/address-plan.yaml"

[dependency-groups]
dev = [
    "codespell>=2.4.2",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
