# Routed baseline permissions apply to every host in each selected LAN.
# Selectors are address-plan network IDs, vlan-N IDs, or contained CIDRs.
# Same-VLAN traffic does not cross a router firewall.
schema_version: "2.0"
testbed_id: metropolis
flows:
  - id: scada-modbus
    source: scada
    destination: [plant-intake, plant-dosing, plant-filtration, plant-disinfection, reservoir, raw-water]
    protocol: tcp
    port: 502
  - {id: scada-dnp3, source: scada, destination: [reservoir, raw-water], protocol: tcp, port: 20000}
  - {id: engineering-modbus, source: engineering, destination: plant-intake, protocol: tcp, port: 502}
  - {id: engineering-coap, source: engineering, destination: plant-intake, protocol: udp, port: 5683}
  - {id: intake-mqtt, source: plant-intake, destination: mqtt, protocol: tcp, port: 1883}
  - {id: scada-mqtt, source: scada, destination: mqtt, protocol: tcp, port: 1883}
  - {id: historian-mqtt, source: historian, destination: mqtt, protocol: tcp, port: 1883}
  - id: hmi-mqtt
    source: [plant-hmi, dosing-hmi, filtration-hmi, disinfection-hmi]
    destination: mqtt
    protocol: tcp
    port: 1883
  - id: engineering-hmi
    source: engineering
    destination: [plant-hmi, dosing-hmi, filtration-hmi, disinfection-hmi]
    protocol: tcp
    port: 8080
  - {id: engineering-rdp-dmz-tcp, source: engineering, destination: ot-dmz, protocol: tcp, port: 3389}
  - {id: engineering-rdp-dmz-udp, source: engineering, destination: ot-dmz, protocol: udp, port: 3389}
  - {id: operations-rdp-engineering-tcp, source: scada, destination: engineering, protocol: tcp, port: 3389}
  - {id: operations-rdp-engineering-udp, source: scada, destination: engineering, protocol: udp, port: 3389}
  - {id: engineering-dns-udp, source: engineering, destination: ot-services, protocol: udp, port: 53}
  - {id: engineering-dns-tcp, source: engineering, destination: ot-services, protocol: tcp, port: 53}
  - {id: engineering-ntp, source: engineering, destination: ot-services, protocol: udp, port: 123}
  - id: engineering-router-snmp
    source: 10.20.21.20/32
    destination: [10.20.10.1/32, 10.20.30.1/32, 10.20.40.1/32, 172.31.255.1/32, 10.20.14.1/32, 10.20.15.1/32]
    protocol: udp
    port: 161
  - id: router-syslog
    source: [router/MET-PLANT, router/MET-OT-CORE, router/MET-OT-DMZ, router/MET-OT-WAN, router/MET-RESERVOIR, router/MET-RAW-WATER]
    destination: ot-services
    protocol: udp
    port: 514
