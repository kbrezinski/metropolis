    gateway: 10.20.21.1
    protocols: [ssh, sftp]
    environment:
      NODE_HOSTNAME: MET-ENGINEERING-01
      NODE_IP: 10.20.21.10/24
      NODE_GATEWAY: 10.20.21.1
      ENGINEER_PASSWORD: LabOnly_Engineering_2026

  - name: MET-CONTROL-CLIENT-01
    model: testbeds/metropolis/devices/operations/control_client
    image: metropolis/control-client:dev
    site: treatment_plant
    subnet: 10.20.21.0/24
    address: 10.20.21.20/24
    gateway: 10.20.21.1
    protocols: [modbus-tcp, dns, ntp]
    environment:
      NODE_HOSTNAME: MET-CONTROL-CLIENT-01
      NODE_IP: 10.20.21.20/24
      NODE_GATEWAY: 10.20.21.1
      PLC_DNS_NAME: plc-intake.metropolis.test
      DNS_SERVER: 10.20.30.10
      NTP_SERVER: 10.20.30.11
      CONTROL_INTERVAL: "30"

  - name: MET-LEGACY-GATEWAY-01
    model: testbeds/metropolis/devices/field/legacy_gateway
    image: metropolis/legacy-gateway:dev
    site: treatment_plant
    subnet: 10.20.10.0/24
