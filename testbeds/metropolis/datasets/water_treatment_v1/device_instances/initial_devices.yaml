      NODE_IP: 10.20.30.11/24
      NODE_GATEWAY: 10.20.30.1

  # ---------------------------------------------------------------------------
  # Reachability probe: a minimal host with no service. It exists so each zone
  # has something to ping or connect to, which makes routing between zones
  # verifiable before real devices are in place.
  # ---------------------------------------------------------------------------

  - name: MET-DEBUG-DMZ-01
    model: testbeds/metropolis/devices/field/reachability_probe
    image: metropolis/reachability-probe:dev
    site: treatment_plant
    subnet: 10.20.40.0/24
    address: 10.20.40.10/24
    gateway: 10.20.40.1
    protocols: [icmp]
    environment:
      NODE_HOSTNAME: MET-DEBUG-DMZ-01
      NODE_IP: 10.20.40.10/24
      NODE_GATEWAY: 10.20.40.1

  # ---------------------------------------------------------------------------
  # Attack-lab nodes: synthetic Mirai and Merlin control-plane models.
  #
  # These are simulations, not malware. The Mirai chain reproduces Gotham's
  # cnc/scan-listener/loader/bot lifecycle, and the Merlin pair reproduces its
  # C2 console and agent choreography. The loader serves an inert text stub and
  # no bot or agent binary exists in this repository. Keep this subnet isolated
  # and do not bridge it to a production network.
  # ---------------------------------------------------------------------------

  - name: MET-MIRAI-CNC-01
    model: testbeds/metropolis/devices/attack/mirai/cnc
    image: metropolis/mirai-cnc:dev
    site: treatment_plant
    subnet: 10.99.10.0/24
    address: 10.99.10.10/24
    gateway: 10.99.10.1
    protocols: [mirai-cnc, mirai-report]
    environment:
      NODE_HOSTNAME: MET-MIRAI-CNC-01
      NODE_IP: 10.99.10.10/24
      NODE_GATEWAY: 10.99.10.1
      MIRAI_CNC_PORT: "23"
      MIRAI_REPORT_PORT: "48101"
      C2_PORT: "23"

  - name: MET-MIRAI-LISTENER-01
