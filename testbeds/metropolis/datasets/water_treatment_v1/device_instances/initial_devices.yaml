      NODE_GATEWAY: 10.20.50.1
      HMI_USERNAME: operator
      HMI_PASSWORD: LabOnly_HMI_2026
      HMI_HTTP_PORT: "8080"
      MQTT_TELEMETRY_TOPIC: metropolis/scada/intake/status
      MQTT_HOST: 10.20.23.10
      MQTT_TOPIC: metropolis/plant/intake/command
      MQTT_USERNAME: lab_device
      MQTT_PASSWORD: LabOnly_Device_2026

  - name: MET-ENGINEERING-01
    model: testbeds/metropolis/devices/operations/engineering_workstation
