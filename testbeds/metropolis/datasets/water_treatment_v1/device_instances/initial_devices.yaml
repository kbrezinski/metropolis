# Initial Metropolis device instances. Addresses are planned examples; reconcile
# them with the final GNS3 node interfaces before capturing a dataset.
schema_version: "1.0"
testbed_id: metropolis
devices:
  - name: MET-PLC-INTAKE-01
    model: testbeds/metropolis/devices/controllers/plc
    image: metropolis/controller:dev
    site: treatment_plant
    subnet: 10.20.10.0/24
    address: 10.20.10.10/24
    gateway: 10.20.10.1
    protocols: [modbus-tcp]
    environment:
      NODE_HOSTNAME: MET-PLC-INTAKE-01
      NODE_IP: 10.20.10.10/24
      NODE_GATEWAY: 10.20.10.1
      DEVICE_ROLE: PLC
      PROCESS_LEVEL: "650"
      PROCESS_FLOW: "120"
      PROCESS_QUALITY: "950"

  - name: MET-RTU-RESERVOIR-01
    model: testbeds/metropolis/devices/controllers/plc
    image: metropolis/controller:dev
    site: reservoir_booster
    subnet: 10.20.14.0/24
    address: 10.20.14.10/24
    gateway: 10.20.14.1
    protocols: [modbus-tcp]
    environment:
      NODE_HOSTNAME: MET-RTU-RESERVOIR-01
      NODE_IP: 10.20.14.10/24
      NODE_GATEWAY: 10.20.14.1
      DEVICE_ROLE: RTU

  - name: MET-RTU-RAW-WATER-01
    model: testbeds/metropolis/devices/controllers/plc
    image: metropolis/controller:dev
    site: raw_water_lift
    subnet: 10.20.15.0/24
    address: 10.20.15.10/24
    gateway: 10.20.15.1
    protocols: [modbus-tcp]
    environment:
      NODE_HOSTNAME: MET-RTU-RAW-WATER-01
      NODE_IP: 10.20.15.10/24
      NODE_GATEWAY: 10.20.15.1
      DEVICE_ROLE: RTU

  - name: MET-SENSOR-INTAKE-01
    model: testbeds/metropolis/devices/field/sensors
    image: metropolis/mqtt-sensor:dev
    site: treatment_plant
    subnet: 10.20.10.0/24
    address: 10.20.10.20/24
    gateway: 10.20.10.1
    protocols: [mqtt, coap]
    environment:
      NODE_HOSTNAME: MET-SENSOR-INTAKE-01
      NODE_IP: 10.20.10.20/24
      NODE_GATEWAY: 10.20.10.1
      SENSOR_TYPE: level
      SENSOR_VALUE: "65.0"
      # Report the process reading from the PLC rather than a fixed value, so
      # this sensor and the PLC registers agree and both move.
      PLC_HOST: 10.20.10.10
      SENSOR_REGISTER: "0"
      SENSOR_DIVISOR: "10"
      MQTT_TOPIC: metropolis/plant/intake/telemetry
      MQTT_USERNAME: lab_device
      MQTT_PASSWORD: LabOnly_Device_2026
      COAP_ENABLED: "true"
      COAP_PORT: "5683"

  - name: MET-MQTT-BROKER-01
    model: testbeds/metropolis/devices/services/mqtt_broker
    image: metropolis/mqtt-broker:dev
    site: treatment_plant
    subnet: 10.20.23.0/24
    address: 10.20.23.10/24
    gateway: 10.20.23.1
    protocols: [mqtt]
    environment:
      NODE_HOSTNAME: MET-MQTT-BROKER-01
      NODE_IP: 10.20.23.10/24
      NODE_GATEWAY: 10.20.23.1
      MQTT_DEVICE_USERNAME: lab_device
      MQTT_DEVICE_PASSWORD: LabOnly_Device_2026
      MQTT_OPERATOR_USERNAME: lab_operator
      MQTT_OPERATOR_PASSWORD: LabOnly_MQTT_2026

  - name: MET-SCADA-01
    model: testbeds/metropolis/devices/operations/scada
    image: metropolis/scada:dev
    site: treatment_plant
    subnet: 10.20.20.0/24
    address: 10.20.20.10/24
    gateway: 10.20.20.1
    protocols: [modbus-tcp, mqtt]
    environment:
      NODE_HOSTNAME: MET-SCADA-01
      NODE_IP: 10.20.20.10/24
      NODE_GATEWAY: 10.20.20.1
      PLC_HOST: 10.20.10.10
      MQTT_HOST: 10.20.23.10
      MQTT_USERNAME: lab_device
      MQTT_PASSWORD: LabOnly_Device_2026

  - name: MET-HISTORIAN-01
    model: testbeds/metropolis/devices/operations/historian
    image: metropolis/historian:dev
    site: treatment_plant
    subnet: 10.20.22.0/24
    address: 10.20.22.10/24
    gateway: 10.20.22.1
    protocols: [mqtt]
    environment:
      NODE_HOSTNAME: MET-HISTORIAN-01
      NODE_IP: 10.20.22.10/24
      NODE_GATEWAY: 10.20.22.1
      MQTT_HOST: 10.20.23.10
      MQTT_USERNAME: lab_device
